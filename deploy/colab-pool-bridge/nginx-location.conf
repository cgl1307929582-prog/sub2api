# Include inside the existing TLS Pool virtual host. The bridge validates Bearer
# credentials before accessing any upstream; dashboard Basic Auth stays intact.
location ^~ /sub2api/ {
    auth_basic off;
    limit_req zone=colab_sub2api burst=60 nodelay;
    proxy_pass http://127.0.0.1:18902/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Authorization $http_authorization;
    proxy_buffering off;
    proxy_request_buffering on;
    client_max_body_size 50m;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
}
